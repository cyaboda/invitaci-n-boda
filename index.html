<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carolina & Alexander</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top right, rgba(191, 111, 78, 0.12), transparent 32%),
        radial-gradient(circle at bottom left, rgba(191, 111, 78, 0.10), transparent 28%),
        #f7f1eb;
      color: #4b342a;
      overflow-x: hidden;
    }

    .portada {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 22px;
      text-align: center;
      overflow: hidden;
    }

    .detalle {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.55;
      pointer-events: none;
    }

    .detalle-1 {
      width: 260px;
      height: 260px;
      background: rgba(181, 92, 58, 0.12);
      top: -90px;
      right: -70px;
    }

    .detalle-2 {
      width: 330px;
      height: 330px;
      background: rgba(154, 80, 52, 0.10);
      bottom: -140px;
      left: -100px;
    }

    .linea-vertical {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(151, 83, 56, 0.22),
        transparent
      );
    }

    .linea-izq {
      left: 7%;
    }

    .linea-der {
      right: 7%;
    }

    .contenido {
      width: 100%;
      max-width: 720px;
      position: relative;
      z-index: 2;
      animation: aparecer 1.1s ease forwards;
    }

    .sobrelinea {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #a45c3f;
      margin-bottom: 26px;
    }

    .nombres {
      margin: 0;
      font-size: clamp(48px, 9vw, 90px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -2px;
      color: #7f422e;
    }

    .ampersand {
      display: block;
      font-size: 0.54em;
      font-style: italic;
      margin: 14px 0 10px;
      color: #bc6a47;
    }

    .separador {
      width: 110px;
      height: 1px;
      background: rgba(155, 82, 53, 0.45);
      margin: 34px auto;
      position: relative;
    }

    .separador::after {
      content: "♥";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #f7f1eb;
      padding: 0 12px;
      color: #b65e3c;
      font-size: 12px;
    }

    .texto-invitacion {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9a7362;
      margin-bottom: 14px;
    }

    #nombreInvitado {
      font-size: clamp(30px, 5vw, 44px);
      margin: 0;
      color: #4f3429;
      line-height: 1.15;
    }

    #cupos {
      margin-top: 16px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #6d554a;
    }

    #cargando {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #8a6a5d;
      margin-top: 28px;
    }

    #contenidoInvitado {
      display: none;
      margin-top: 34px;
    }

    #error {
      display: none;
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 30px auto 0;
      line-height: 1.7;
      color: #7b5140;
    }

    .boton {
      margin-top: 34px;
      min-width: 220px;
      padding: 16px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      background: linear-gradient(135deg, #bb6745, #94452d);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(117, 62, 42, 0.18);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(117, 62, 42, 0.24);
    }

    .boton:active {
      transform: translateY(0);
    }

    .detalle-inferior {
      margin-top: 35px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      color: #b07a66;
      text-transform: uppercase;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .portada {
        padding: 34px 20px;
      }

      .sobrelinea {
        letter-spacing: 4px;
        font-size: 10px;
      }

      .nombres {
        letter-spacing: -1px;
      }

      .linea-izq {
        left: 4%;
      }

      .linea-der {
        right: 4%;
      }

      .boton {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <section class="portada">

    <div class="detalle detalle-1"></div>
    <div class="detalle detalle-2"></div>

    <div class="linea-vertical linea-izq"></div>
    <div class="linea-vertical linea-der"></div>

    <div class="contenido">

      <div class="sobrelinea">
        Nos casamos
      </div>

      <h1 class="nombres">
        Carolina
        <span class="ampersand">&</span>
        Alexander
      </h1>

      <div class="separador"></div>

      <div id="cargando">
        Preparando tu invitación...
      </div>

      <div id="contenidoInvitado">

        <div class="texto-invitacion">
          Invitación especial para
        </div>

        <div id="nombreInvitado"></div>

        <div id="cupos"></div>

        <button
          class="boton"
          id="abrirInvitacion"
          type="button">
          ABRIR INVITACIÓN
        </button>

        <div class="detalle-inferior">
          Nuestra historia comienza aquí
        </div>

      </div>

      <div id="error">
        No pudimos encontrar esta invitación.<br>
        Revisa que hayas abierto el enlace correcto.
      </div>

    </div>

  </section>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz_-f9kBoM8sUsXhQ9BqC4MuiWM3H8QtZrAIO6-Fgw-GZsttL3mVH4GUk5mT_3ZqgwxcA/exec";

    const parametros =
      new URLSearchParams(window.location.search);

    const codigo =
      parametros.get("i");


    function cargarInvitado() {

      if (!codigo) {
        mostrarError();
        return;
      }

      const script =
        document.createElement("script");

      script.src =
        API_URL +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&callback=recibirInvitado" +
        "&t=" +
        Date.now();

      script.onerror = function () {
        mostrarError();
      };

      document.body.appendChild(script);
    }


    function recibirInvitado(datos) {

      if (!datos || !datos.ok) {
        mostrarError();
        return;
      }

      document.getElementById("nombreInvitado").textContent =
        datos.invitado;

      let mensajeCupos;

      if (Number(datos.cupos) === 1) {

        mensajeCupos =
          "Hemos reservado 1 lugar para ti";

      } else {

        mensajeCupos =
          "Hemos reservado " +
          datos.cupos +
          " lugares para ti";
      }

      document.getElementById("cupos").textContent =
        mensajeCupos;

      document.getElementById("cargando").style.display =
        "none";

      document.getElementById("contenidoInvitado").style.display =
        "block";
    }


    function mostrarError() {

      document.getElementById("cargando").style.display =
        "none";

      document.getElementById("contenidoInvitado").style.display =
        "none";

      document.getElementById("error").style.display =
        "block";
    }


    document
      .getElementById("abrirInvitacion")
      .addEventListener("click", function () {

        alert("Aquí comenzará la invitación 💍");

      });


    cargarInvitado();

  </script>

</body>

</html>
