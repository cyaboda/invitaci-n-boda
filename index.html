<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carolina & Alexander</title>

  <style>

    /* =========================================
       CONFIGURACIÓN GENERAL
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f1eb;
      color: #4b342a;
      overflow-x: hidden;
    }


    /* =========================================
       PORTADA
    ========================================= */

    .portada {
      min-height: 100vh;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 22px;

      text-align: center;
      overflow: hidden;

      background:
        radial-gradient(
          circle at top right,
          rgba(190, 102, 67, 0.13),
          transparent 30%
        ),

        radial-gradient(
          circle at bottom left,
          rgba(190, 102, 67, 0.12),
          transparent 32%
        ),

        #f7f1eb;
    }


    /* =========================================
       MANCHAS SUAVES TERRACOTA
    ========================================= */

    .mancha {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .mancha-arriba {
      width: 420px;
      height: 420px;

      top: -220px;
      right: -180px;

      background:
        radial-gradient(
          circle,
          rgba(190, 102, 67, 0.13),
          rgba(190, 102, 67, 0.04) 60%,
          transparent 72%
        );
    }

    .mancha-abajo {
      width: 470px;
      height: 470px;

      bottom: -260px;
      left: -210px;

      background:
        radial-gradient(
          circle,
          rgba(167, 83, 52, 0.14),
          rgba(190, 102, 67, 0.04) 60%,
          transparent 72%
        );
    }


    /* =========================================
       LÍNEAS LATERALES
    ========================================= */

    .linea-vertical {
      position: absolute;

      top: 5%;
      bottom: 5%;

      width: 1px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(155, 82, 53, 0.22),
          transparent
        );

      z-index: 1;
    }

    .linea-izquierda {
      left: 7%;
    }

    .linea-derecha {
      right: 7%;
    }


    /* =========================================
       DECORACIÓN BOTÁNICA
    ========================================= */

    .floral {
      position: absolute;

      color: #ad5939;

      pointer-events: none;

      z-index: 1;

      opacity: 0.72;
    }

    .floral svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }


    /* RAMA SUPERIOR DERECHA */

    .floral-arriba-derecha {
      width: 300px;
      height: 520px;

      top: -40px;
      right: -25px;

      transform: rotate(2deg);
    }


    /* RAMA INFERIOR IZQUIERDA */

    .floral-abajo-izquierda {
      width: 280px;
      height: 500px;

      bottom: -50px;
      left: -35px;

      transform: rotate(-3deg);
    }


    /* =========================================
       CONTENIDO CENTRAL
    ========================================= */

    .contenido {
      width: 100%;
      max-width: 760px;

      position: relative;

      z-index: 5;

      animation: aparecer 1.2s ease forwards;
    }


    /* NOS CASAMOS */

    .sobrelinea {
      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 6px;

      text-transform: uppercase;

      color: #a45c3f;

      margin-bottom: 28px;
    }


    /* =========================================
       NOMBRES
    ========================================= */

    .nombres {
      margin: 0;

      font-size: clamp(52px, 8vw, 92px);

      font-weight: 400;

      line-height: 0.95;

      letter-spacing: -2px;

      color: #85452f;
    }

    .ampersand {
      display: block;

      font-size: 0.53em;

      font-style: italic;

      margin: 13px 0 11px;

      color: #bc6947;
    }


    /* =========================================
       SEPARADOR
    ========================================= */

    .separador {
      width: 120px;
      height: 1px;

      margin: 37px auto;

      position: relative;

      background:
        rgba(166, 86, 55, 0.48);
    }

    .separador::after {
      content: "♥";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: #f7f1eb;

      padding: 0 13px;

      color: #b75f3d;

      font-size: 11px;
    }


    /* =========================================
       INVITADO
    ========================================= */

    .texto-invitacion {
      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #a77b68;

      margin-bottom: 15px;
    }

    #nombreInvitado {
      font-size: clamp(31px, 5vw, 46px);

      line-height: 1.15;

      color: #4f3429;

      margin: 0;
    }

    #cupos {
      margin-top: 17px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      line-height: 1.6;

      color: #6d554a;
    }


    /* =========================================
       CARGANDO
    ========================================= */

    #cargando {
      font-family: Arial, sans-serif;

      font-size: 14px;

      color: #8a6a5d;

      margin-top: 28px;
    }

    #contenidoInvitado {
      display: none;
    }


    /* =========================================
       ERROR
    ========================================= */

    #error {
      display: none;

      font-family: Arial, sans-serif;

      max-width: 420px;

      margin: 30px auto 0;

      line-height: 1.7;

      color: #7b5140;
    }


    /* =========================================
       BOTÓN
    ========================================= */

    .boton {
      margin-top: 34px;

      min-width: 235px;

      padding: 17px 31px;

      border: 1px solid rgba(255, 255, 255, 0.25);

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #c16a46,
          #a54e31
        );

      color: white;

      font-family: Arial, sans-serif;

      font-size: 12px;

      letter-spacing: 2.4px;

      cursor: pointer;

      box-shadow:
        0 15px 35px
        rgba(117, 62, 42, 0.20);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .boton:hover {
      transform: translateY(-3px);

      box-shadow:
        0 19px 38px
        rgba(117, 62, 42, 0.27);
    }

    .boton:active {
      transform: translateY(0);
    }


    /* =========================================
       TEXTO INFERIOR
    ========================================= */

    .detalle-inferior {
      margin-top: 38px;

      font-family: Arial, sans-serif;

      font-size: 10px;

      letter-spacing: 4px;

      color: #b07a66;

      text-transform: uppercase;
    }


    /* =========================================
       ANIMACIONES
    ========================================= */

    @keyframes aparecer {

      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* Movimiento muy sutil de las ramas */

    .floral-arriba-derecha {
      animation:
        moverRamaDerecha
        8s ease-in-out infinite alternate;
    }

    .floral-abajo-izquierda {
      animation:
        moverRamaIzquierda
        9s ease-in-out infinite alternate;
    }

    @keyframes moverRamaDerecha {

      from {
        transform:
          rotate(2deg)
          translateY(0);
      }

      to {
        transform:
          rotate(4deg)
          translateY(6px);
      }

    }

    @keyframes moverRamaIzquierda {

      from {
        transform:
          rotate(-3deg)
          translateY(0);
      }

      to {
        transform:
          rotate(-1deg)
          translateY(-5px);
      }

    }


    /* =========================================
       CELULARES
    ========================================= */

    @media (max-width: 600px) {

      .portada {
        padding:
          45px
          22px
          55px;
      }

      .sobrelinea {
        font-size: 10px;

        letter-spacing: 4px;

        margin-bottom: 25px;
      }

      .nombres {
        letter-spacing: -1px;
      }

      .linea-izquierda {
        left: 4%;
      }

      .linea-derecha {
        right: 4%;
      }

      .floral-arriba-derecha {
        width: 175px;
        height: 330px;

        right: -55px;
        top: -25px;

        opacity: 0.55;
      }

      .floral-abajo-izquierda {
        width: 175px;
        height: 330px;

        left: -55px;
        bottom: -40px;

        opacity: 0.55;
      }

      .boton {
        width: 100%;

        max-width: 310px;
      }

      .detalle-inferior {
        font-size: 9px;

        letter-spacing: 3px;
      }

    }

  </style>

</head>

  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz_-f9kBoM8sUsXhQ9BqC4MuiWM3H8QtZrAIO6-Fgw-GZsttL3mVH4GUk5mT_3ZqgwxcA/exec";


    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const codigo =
      parametros.get("i");


    /* ======================================
       CARGAR INVITADO
    ====================================== */

    function cargarInvitado() {

      if (!codigo) {

        mostrarError();

        return;

      }


      const script =
        document.createElement("script");


      script.src =
        API_URL +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&callback=recibirInvitado" +
        "&t=" +
        Date.now();


      script.onerror = function () {

        mostrarError();

      };


      document.body.appendChild(script);

    }


    /* ======================================
       RECIBIR DATOS
    ====================================== */

    function recibirInvitado(datos) {


      if (!datos || !datos.ok) {

        mostrarError();

        return;

      }


      document
        .getElementById("nombreInvitado")
        .textContent =
        datos.invitado;


      let mensajeCupos;


      if (Number(datos.cupos) === 1) {

        mensajeCupos =
          "Hemos reservado 1 lugar para ti";

      }

      else {

        mensajeCupos =
          "Hemos reservado " +
          datos.cupos +
          " lugares para ti";

      }


      document
        .getElementById("cupos")
        .textContent =
        mensajeCupos;


      document
        .getElementById("cargando")
        .style.display =
        "none";


      document
        .getElementById("contenidoInvitado")
        .style.display =
        "block";

    }


    /* ======================================
       ERROR
    ====================================== */

    function mostrarError() {


      document
        .getElementById("cargando")
        .style.display =
        "none";


      document
        .getElementById("contenidoInvitado")
        .style.display =
        "none";


      document
        .getElementById("error")
        .style.display =
        "block";

    }


    /* ======================================
       BOTÓN
    ====================================== */

    document
      .getElementById("abrirInvitacion")
      .addEventListener(
        "click",
        function () {

          alert(
            "Aquí comenzará la invitación 💍"
          );

        }
      );


    /* INICIAR */

    cargarInvitado();

  </script>
